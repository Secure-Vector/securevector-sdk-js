# Publishes @securevector/sdk, and the unscoped `securevector` alias, when a new
# version reaches main. Same shape as the threat-monitor launcher workflow.
#
#   Merge to main, version not on npm yet -> checks, then the run waits for
#                                            approval, then publishes both.
#   Any other push to main                -> the check job says "nothing to
#                                            publish" and no approval is asked.
#
# ─── SETUP: OIDC TRUSTED PUBLISHING, NO SECRET ────────────────────────────────
#
# On npmjs.com, for EACH of @securevector/sdk and securevector, under Settings,
# Trusted Publisher:
#        Repository owner: Secure-Vector
#        Repository name:  securevector-sdk-js
#        Workflow name:    release.yml
#        Environment:      production-npm        (must match the jobs below)
# and Publishing access set to "Require two-factor authentication and disallow
# bypass 2fa tokens", the same as n8n-nodes-securevector. No step here reads a
# token, so trusted publishing is the only way to publish.
#
# ─── WHY THE APPROVAL GATE ────────────────────────────────────────────────────
#
# Trusted publishing already constrains publishes to this repo and this workflow
# file. The environment gate adds a human, so a hijacked run cannot silently ship
# a release of a security product. production-npm has required reviewers and
# accepts only the main branch and v* tags.
#
# ─── MAIN ONLY ────────────────────────────────────────────────────────────────
#
#   1. The environment accepts only main and v* tags, so a run anywhere else
#      never gets the OIDC token npm trusts.
#   2. The workflow triggers on main (or a v* tag or dispatch) and every job
#      refuses any other ref.
#   3. The commit must already be on main.

name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # No environment here, so an ordinary push to main never asks for approval.
  check:
    name: Is there a version to publish
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      # Actions are pinned to commit SHAs: a moved tag on a third-party action
      # must not be able to run inside a workflow that can mint a publish token.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history so the main check below can see the branch.
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse anything that is not on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main. Publish only from main."
            exit 1
          fi

      - name: Decide
        id: decide
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "@securevector/sdk@$VERSION" version > /dev/null 2>&1 \
             && npm view "securevector@$VERSION" version > /dev/null 2>&1; then
            echo "::notice::@securevector/sdk and securevector $VERSION are already on npm. Nothing to publish; bump the version to release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$VERSION is not on npm yet. The publish jobs will wait for approval."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: Verify before publishing
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node --test test/*.test.mjs

      - name: Assert zero runtime dependencies
        run: |
          COUNT=$(node -p "Object.keys(require('./package.json').dependencies || {}).length")
          if [ "$COUNT" != "0" ]; then
            echo "::error::@securevector/sdk must have zero runtime dependencies, found $COUNT."
            exit 1
          fi

      - name: Check the alias version and pin match the SDK
        run: |
          SDK=$(node -p "require('./package.json').version")
          ALIAS=$(node -p "require('./packages/alias/package.json').version")
          PIN=$(node -p "require('./packages/alias/package.json').dependencies['@securevector/sdk']")
          echo "sdk=$SDK alias=$ALIAS pin=$PIN"
          if [ "$SDK" != "$ALIAS" ] || [ "$SDK" != "$PIN" ]; then
            echo "::error::package version, alias version and alias pin must all be the same number."
            exit 1
          fi

      # On a tag, the tag must be the version, or a mistyped tag would publish
      # something nobody asked for.
      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          SDK=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$SDK" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package version $SDK."
            exit 1
          fi

      - name: Check the CHANGELOG has an entry for this version
        run: |
          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' entry."
            exit 1
          fi
        env:
          VERSION: ${{ needs.check.outputs.version }}

  publish-sdk:
    name: Publish @securevector/sdk
    needs: [check, verify]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # Required reviewers: the run waits here for your approval.
    environment: production-npm

    permissions:
      # Mint an OIDC token for trusted publishing and the provenance attestation.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Node 24 ships npm 11, the first major that can publish through
          # trusted publishing (11.5.1 and later). Node 20's npm 10 cannot.
          node-version: '24'
          # Provenance only signs when the publish target is set explicitly
          # through setup-node.
          registry-url: 'https://registry.npmjs.org/'

      - run: npm ci --ignore-scripts
      - run: npm run build

      - name: Publish
        # Skip cleanly if an earlier, partly failed run already published it.
        run: |
          npm --version
          if npm view "@securevector/sdk@$VERSION" version > /dev/null 2>&1; then
            echo "@securevector/sdk@$VERSION is already on npm."
          else
            npm publish --provenance --access public
          fi
        env:
          VERSION: ${{ needs.check.outputs.version }}

  publish-alias:
    name: Publish the unscoped securevector alias
    # Strictly after the scoped package: the alias pins an exact version of it,
    # so publishing the alias first would ship a package that cannot install.
    needs: [check, publish-sdk]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: production-npm

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org/'

      # The alias is three one-line files, so there is nothing to build and
      # nothing to install. Wait for the registry to serve the version it pins,
      # rather than assuming the previous job's publish is visible instantly.
      - name: Wait for the scoped package to be installable
        run: |
          for i in $(seq 1 30); do
            if npm view "@securevector/sdk@$VERSION" version > /dev/null 2>&1; then
              echo "@securevector/sdk@$VERSION is on the registry"
              exit 0
            fi
            echo "attempt $i: not visible yet, waiting"
            sleep 10
          done
          echo "::error::@securevector/sdk@$VERSION never became visible; the alias would not install."
          exit 1
        env:
          VERSION: ${{ needs.check.outputs.version }}

      - name: Publish
        working-directory: packages/alias
        run: |
          npm --version
          if npm view "securevector@$VERSION" version > /dev/null 2>&1; then
            echo "securevector@$VERSION is already on npm."
          else
            npm publish --provenance --access public
          fi
        env:
          VERSION: ${{ needs.check.outputs.version }}
